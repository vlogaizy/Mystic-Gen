<!DOCTYPE html>
<html>
<head>

<title>🥚 Dark Magic Egg AI 🥚</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
overflow:hidden;

font-family:'Segoe UI',sans-serif;

display:flex;
align-items:center;
justify-content:center;

color:white;

background:

radial-gradient(circle at 20% 20%,#3b0764,transparent 35%),
radial-gradient(circle at 80% 70%,#003b4d,transparent 40%),
#010107;

}




#network{

position:absolute;
inset:0;

z-index:0;

}



/* Moving background */

body:before{

content:"";

position:absolute;

width:1000px;
height:1000px;


background:

conic-gradient(
transparent,
rgba(160,0,255,.25),
transparent,
rgba(0,255,255,.18),
transparent
);



filter:blur(120px);


animation:energy 18s linear infinite;


}


@keyframes energy{

0%{
transform:rotate(0deg) scale(1);
}

50%{
transform:rotate(180deg) scale(1.3);
}

100%{
transform:rotate(360deg) scale(1);
}

}





/* LOGIN */


#login{

position:fixed;

inset:0;

z-index:100;


display:flex;

align-items:center;

justify-content:center;


background:

linear-gradient(
135deg,
#020204,
#16002c,
#002b3a
);


}



.login-box{


width:90%;

max-width:400px;


padding:40px;


border-radius:30px;


text-align:center;


background:

rgba(255,255,255,.08);


backdrop-filter:blur(25px);



border:

1px solid rgba(255,255,255,.2);



}



.login-box h1{

color:white;

}



.login-box input{


width:100%;


padding:15px;


border-radius:15px;


border:1px solid rgba(255,255,255,.2);



background:rgba(0,0,0,.5);



color:white;


text-align:center;


font-size:18px;


margin:20px 0;


}



#error{

display:none;

color:#ff7777;

}





/* MAIN CARD */


.container{


position:relative;

z-index:5;


width:90%;

max-width:900px;


padding:40px;


border-radius:35px;


background:

rgba(255,255,255,.08);



backdrop-filter:

blur(30px);



border:

1px solid rgba(255,255,255,.18);



}



h1{


text-align:center;


font-size:44px;



background:

linear-gradient(
90deg,
#fff,
#9be7ff,
#d8b4fe
);



-webkit-background-clip:text;


color:transparent;



}



.subtitle{


text-align:center;

opacity:.7;

}





.buttons{


display:flex;

justify-content:center;

gap:15px;

margin:25px;


}




button{


padding:16px 40px;


border-radius:18px;


cursor:pointer;


font-size:17px;


font-weight:600;


color:white;



background:

rgba(255,255,255,.12);



border:

1px solid rgba(255,255,255,.25);



backdrop-filter:

blur(15px);



box-shadow:

inset 0 0 15px rgba(255,255,255,.05);



transition:.35s;


}




button:hover{


transform:translateY(-5px);



background:

linear-gradient(
135deg,
#7c3aed,
#0891b2
);



border-color:white;


}




textarea{


width:100%;


height:380px;


padding:20px;


border-radius:25px;


background:

rgba(0,0,0,.55);



border:

1px solid rgba(255,255,255,.2);



color:white;



font-size:16px;


resize:none;


}





.footer{


position:absolute;


bottom:20px;


left:50%;


transform:translateX(-50%);


z-index:10;


font-size:18px;


letter-spacing:4px;


color:white;


opacity:.8;


}





@media(max-width:700px){


.container{

width:95%;

padding:25px;

}



h1{

font-size:30px;

}



.buttons{

flex-direction:column;

}



button{

width:100%;

}



textarea{

height:280px;

font-size:14px;

}



.footer{

font-size:14px;

}

}



</style>

</head>


<body>



<div id="login">


<div class="login-box">


<h1>
🔐 LAZY AI
</h1>


<p>
Enter Password
</p>


<input 
type="password"
id="password"
placeholder="Password">


<button onclick="unlock()">
UNLOCK
</button>


<div id="error">
Wrong Password
</div>


</div>


</div>





<canvas id="network"></canvas>





<div class="container">


<h1>
🥚 Dark Magic Egg AI 🥚
</h1>


<div class="subtitle">

Infinite Fantasy Prompt Generator

</div>



<div class="buttons">


<button onclick="generatePrompt()">

🎲 Generate

</button>


<button onclick="copyPrompt()">

📋 Copy

</button>


</div>




<textarea id="output"
placeholder="Your magical prompt appears here...">
</textarea>


</div>




<div class="footer">

Create by Lazy

</div>





<script>


/* LOGIN SAVE */


function unlock(){


let p=document.getElementById("password").value;


if(p==="1111"){


localStorage.setItem(
"lazyAIUnlocked",
"true"
);


document.getElementById("login").style.display="none";


}

else{


document.getElementById("error").style.display="block";


}

}



window.onload=()=>{


if(localStorage.getItem("lazyAIUnlocked")
==="true"){


document.getElementById("login").style.display="none";


}


};





/* NETWORK */


const canvas=document.getElementById("network");

const ctx=canvas.getContext("2d");


canvas.width=innerWidth;

canvas.height=innerHeight;


let mouse={x:null,y:null};



onmousemove=e=>{

mouse.x=e.clientX;

mouse.y=e.clientY;

};



class Node{


constructor(){


this.x=Math.random()*canvas.width;

this.y=Math.random()*canvas.height;


this.dx=(Math.random()-.5)*.5;

this.dy=(Math.random()-.5)*.5;


this.size=2;


}



update(){


this.x+=this.dx;

this.y+=this.dy;



if(this.x<0||this.x>canvas.width)
this.dx*=-1;


if(this.y<0||this.y>canvas.height)
this.dy*=-1;



if(mouse.x){


let dx=mouse.x-this.x;

let dy=mouse.y-this.y;


let d=Math.sqrt(dx*dx+dy*dy);


if(d<150){

this.x-=dx*.003;

this.y-=dy*.003;

}


}


}



draw(){


ctx.beginPath();


ctx.arc(
this.x,
this.y,
this.size,
0,
Math.PI*2
);


ctx.fillStyle="#8be9fd";


ctx.fill();


}


}



let nodes=[];


let count=innerWidth<600?60:120;



for(let i=0;i<count;i++)
nodes.push(new Node());




function animate(){


ctx.clearRect(0,0,canvas.width,canvas.height);


nodes.forEach(n=>{

n.update();

n.draw();

});



for(let i=0;i<nodes.length;i++){


for(let j=i+1;j<nodes.length;j++){


let dx=nodes[i].x-nodes[j].x;

let dy=nodes[i].y-nodes[j].y;


let d=Math.sqrt(dx*dx+dy*dy);


if(d<120){


ctx.beginPath();


ctx.moveTo(nodes[i].x,nodes[i].y);


ctx.lineTo(nodes[j].x,nodes[j].y);


ctx.strokeStyle=
"rgba(150,220,255,.25)";


ctx.stroke();


}

}

}


requestAnimationFrame(animate);


}


animate();





/* PROMPT */


const data={

egg:[
"obsidian crystal egg",
"ancient dragon egg",
"dark cosmic egg",
"moonstone magical egg"
],

creature:[
"baby dragon",
"phoenix chick",
"crystal fairy",
"shadow dragon"
],

magic:[
"blue magical mist",
"gold dust",
"dark energy",
"crystal particles"
]

};



function random(a){

return a[Math.floor(Math.random()*a.length)];

}



function generatePrompt(){


output.value=

`

Ultra realistic macro fantasy photography.

A ${random(data.egg)}
covered with glowing ancient runes.

A baby ${random(data.creature)}
emerges from a magical crack.

Magical ${random(data.magic)}
flows around the creature.

Dark cinematic fantasy atmosphere.

8K highly detailed creature photography.

`;

}




function copyPrompt(){


navigator.clipboard.writeText(output.value);

alert("Copied ✨");


}



</script>


</body>
</html>
