    <style>
        :root {
            --primary: #8be9fd;
            --secondary: #bd93f9;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #070514; /* Deep dark background */
            color: white;
            overflow: hidden; /* Prevent scrolling for app-like feel */
            margin: 0;
        }

        /* -------------------------
           LIQUID GLASS EFFECT
           ------------------------- */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(139, 233, 253, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 
                0 0 25px rgba(139, 233, 253, 0.2),
                inset 0 8px 20px rgba(0, 0, 0, 0.4);
            outline: none;
        }

        /* -------------------------
           CUSTOM SCROLLBAR
           ------------------------- */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { 
            background: rgba(189, 147, 249, 0.4); 
            border-radius: 10px; 
        }
        textarea::-webkit-scrollbar-thumb:hover { background: rgba(189, 147, 249, 0.8); }

        /* -------------------------
           TYPOGRAPHY & BUTTONS
           ------------------------- */
        .text-gradient {
            background: linear-gradient(to right, #8be9fd, #bd93f9, #ff79c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-magic {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .btn-magic::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.6s ease;
        }
        
        .btn-magic:hover::before { left: 100%; }
        .btn-magic:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(189, 147, 249, 0.4);
        }
        .btn-magic:active { transform: translateY(1px); }

        /* -------------------------
           ANIMATIONS (Blobs & Floating)
           ------------------------- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .floating { animation: float 4s ease-in-out infinite; }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { transform: translate(30px, -50px) scale(1.1); border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            66% { transform: translate(-20px, 20px) scale(0.9); border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
            100% { transform: translate(0px, 0px) scale(1); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        }
        .animate-blob { animation: blob 10s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* Canvas Background Layer */
        #network {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Custom Toast Notification */
        #toast {
            transform: translateY(100px) translateX(-50%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #toast.show {
            transform: translateY(0) translateX(-50%);
            opacity: 1;
        }
    </style>
</head>

if (passwordInput.value === "1111" || passwordInput.value === "") {

        passwordInput.addEventListener('keypress', (e) => {

        });

        // -------------------------
        // 2. UI TOAST NOTIFICATION
        // -------------------------
        let toastTimeout;
        function showToast() {
            clearTimeout(toastTimeout);
            toastEl.classList.add('show');
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 3000);
        }

        function copyPrompt() {
            if (!outputArea.value) return;
            outputArea.select();
            try {
                document.execCommand("copy");
                showToast();
            } catch (err) {
                console.error('Copy failed', err);
            }
            window.getSelection().removeAllRanges();
        }

        // -------------------------
        // 3. MOUSE INTERACTIVE CANVAS (Design Background)
        // -------------------------
        const canvas = document.getElementById("network");
        const ctx = canvas.getContext("2d");
        let width, height;
        let mouse = { x: null, y: null };
        
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        class Node {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse Repel Logic
                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        this.x -= (dx / dist) * 2;
                        this.y -= (dy / dist) * 2;
                    }
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(139, 233, 253, 0.8)";
                ctx.fill();
            }
        }

        let nodes = Array.from({ length: 80 }, () => new Node());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            nodes.forEach(n => { n.update(); n.draw(); });

            for (let i = 0; i < nodes.length; i++) {
                // Connect to mouse
                if (mouse.x && mouse.y) {
                    let md = Math.hypot(nodes[i].x - mouse.x, nodes[i].y - mouse.y);
                    if (md < 150) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.strokeStyle = `rgba(189, 147, 249, ${1 - md/150})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
                // Connect to each other
                for (let j = i + 1; j < nodes.length; j++) {
                    let d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
                    if (d < 100) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(139, 233, 253, ${(1 - d/100) * 0.2})`;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

function pick(a){

return a[Math.floor(Math.random()*a.length)];

}

/* =====================
GENERATE PROMPT
===================== */


function generatePrompt(){


localStorage.setItem(
"eggHistory",
JSON.stringify(history)
);


let savedPrompts = JSON.parse(
localStorage.getItem("savedPrompts") || "[]"
);


savedPrompts.push(output.value);


localStorage.setItem(
"savedPrompts",
JSON.stringify(savedPrompts)
);


do{


result={

m:pick(data.material),

r:pick(data.rune),

c:pick(data.creature),

s:pick(data.skin),

e:pick(data.eyes),

x:pick(data.element),

l:pick(data.light),

f:pick(data.floor)

};



key=JSON.stringify(result);



}

while(history.includes(key));



history.push(key);



localStorage.setItem(

"eggHistory",

JSON.stringify(history)

);





output.value=`

Ultra-realistic, hyper-detailed macro photography on a ${result.f}.

A single ${result.m} magical egg is nestled on the ground.

The egg surface is etched with glowing ${result.r} runic patterns.

A wide crack has formed across the shell.

A baby ${result.c} emerges from the egg.

Its body has a ${result.s} bioluminescent glow.

The creature's eyes are ${result.e}.

Tiny tendrils of ${result.x} escape from the egg.

Soft ${result.l} filters through the forest canopy.

Cinematic dramatic lighting.

Extreme macro lens.

High-resolution photorealistic fantasy creature photography.

8K detail, realistic textures, magical atmosphere.

`;

}

function copyPrompt(){


navigator.clipboard.writeText(output.value);


alert("Copied ✨");


}
