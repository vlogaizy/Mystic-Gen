<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    background: 
        radial-gradient(circle at 20% 20%, #3b0764, transparent 35%),
        radial-gradient(circle at 80% 70%, #003b4d, transparent 40%),
        #010107;
}

#network {
    position: absolute;
    inset: 0;
    z-index: 0;
}

#login {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #020204, #15002b, #002b3a);
}

.login-box {
    width: 90%;
    max-width: 400px;
    padding: 40px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, .3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.login-box h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

.login-box p {
    color: #ccc;
    margin-bottom: 20px;
}

.login-box input {
    width: 100%;
    padding: 15px;
    margin: 15px 0 25px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.5);
    color: white;
    text-align: center;
    font-size: 18px;
    outline: none;
    transition: border 0.3s;
}

.login-box input:focus {
    border: 1px solid #8be9fd;
}

#error {
    display: none;
    color: #ff6666;
    margin-top: 15px;
    font-size: 14px;
}

.container {
    position: relative;
    z-index: 5;
    width: 95%;
    max-width: 1100px; /* Increased width to accommodate two columns */
    max-height: 90vh; /* Prevent overflowing screen height */
    overflow-y: auto; /* Allow scrolling inside container if needed */
    padding: 40px;
    border-radius: 35px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, .2);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

/* Custom Scrollbar for container */
.container::-webkit-scrollbar {
    width: 8px;
}
.container::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.1); 
    border-radius: 10px;
}
.container::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2); 
    border-radius: 10px;
}
.container::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.4); 
}

h1 {
    text-align: center;
    font-size: 45px;
    margin-top: 0;
    background: linear-gradient(90deg, white, #8be9fd, #d8b4fe);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    text-align: center;
    opacity: .7;
    margin-bottom: 30px;
    font-size: 18px;
}

.action-area {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
}

button {
    padding: 16px 40px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 17px;
    color: white;
    font-weight: bold;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .3);
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #7c3aed, #0891b2);
    border-color: transparent;
}

button:active {
    transform: translateY(1px);
}

.prompt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Two equal columns */
    gap: 25px;
}

.prompt-section {
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,0.2);
    padding: 20px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.1);
}

.prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.prompt-header h3 {
    margin: 0;
    font-size: 20px;
    color: #8be9fd;
}

.small-btn {
    padding: 8px 20px;
    font-size: 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
}

textarea {
    width: 100%;
    height: 280px; /* Adjusted height for dual view */
    padding: 15px;
    border-radius: 15px;
    background: rgba(0, 0, 0, .4);
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 15px;
    line-height: 1.5;

textarea::-webkit-scrollbar {

}
textarea::-webkit-scrollbar-track {

}
textarea::-webkit-scrollbar-thumb {

    border-radius: 10px;

.footer {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);

    letter-spacing: 3px;
    font-size: 12px;
    opacity: .6;

/* Custom Toast for "Copied" (Replacing Alert) */
#toast {
    visibility: hidden;
    min-width: 200px;
    background-color: #0891b2;
    color: #fff;
    text-align: center;
    border-radius: 10px;
    padding: 15px;
    position: fixed;
    z-index: 1000;
    bottom: 30px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.5s, bottom 0.5s;

#toast.show {

    opacity: 1;
    bottom: 50px;

<script>
function unlock() {
    let p = document.getElementById('password').value;
    if(p === "1111") {
        localStorage.setItem("lazyAIUnlocked", "yes");
        document.getElementById('login').style.display = "none";
    } else {
        document.getElementById('error').style.display = "block";
    }
}

window.onload = () => {
    if(localStorage.getItem("lazyAIUnlocked") === "yes") {
        document.getElementById('login').style.display = "none";
    }
    // Ensure canvas animation starts
    animate();
};

document.getElementById('password').onkeypress = e => {
    if(e.key === "Enter") unlock();
};

const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let mouse = {x: null, y: null};
window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

class Node {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - .5) * .5;
        this.vy = (Math.random() - .5) * .5;
    }
    update() {
        // Bounce off edges
        if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
        
        this.x += this.vx;
        this.y += this.vy;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#8be9fd";
        ctx.fill();
    }
}

let nodes = [];
for(let i = 0; i < 100; i++) {
    nodes.push(new Node());
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    nodes.forEach(n => {
        n.update();
        n.draw();
    });

    for(let a = 0; a < nodes.length; a++) {
        for(let b = a; b < nodes.length; b++) {
            let dx = nodes[a].x - nodes[b].x;
            let dy = nodes[a].y - nodes[b].y;
            let d = Math.sqrt(dx * dx + dy * dy);
            
            if(d < 120) {
                ctx.beginPath();
                ctx.moveTo(nodes[a].x, nodes[a].y);
                ctx.lineTo(nodes[b].x, nodes[b].y);
                ctx.strokeStyle = "rgba(150,220,255,.15)";
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}

function copyText(elementId) {
    const textarea = document.getElementById(elementId);
    
    if(!textarea.value) {
        showToast("Nothing to copy! Generate first. ❌");
        return;
    }

    textarea.select();
    textarea.setSelectionRange(0, 99999); // For mobile devices

    try {
        // execCommand is used for maximum iframe compatibility 
        document.execCommand('copy');
        showToast("Copied to clipboard ✔️");
    } catch (err) {
        showToast("Failed to copy ❌");
    }
    
    // Deselect text after copying
    window.getSelection().removeAllRanges();
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.className = "show";
    
    // After 2.5 seconds, remove the show class from DIV
    setTimeout(function(){ 
        toast.className = toast.className.replace("show", ""); 
    }, 2500);
}
